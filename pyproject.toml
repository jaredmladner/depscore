[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "depscore"
version = "0.1.0"
description = "AI-powered SBOM dependency scoring tool"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "anthropic>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "rich>=13.7",
    "cyclonedx-python-lib>=7.0",
    "spdx-tools>=0.8",
]

[project.scripts]
depscore = "depscore.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/depscore"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.envs.default]
features = ["dev"]
